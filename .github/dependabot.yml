# Une seule ouverture par semaine, 5 demandes ouvertes au plus par écosystème ; les mineures et
# correctifs arrivent groupés en une demande, les majeures une à une.
# Délai de 7 jours avant de proposer une nouvelle version (hors correctifs de sécurité).
# Types de commit : dépendances d'exécution fix(deps), développement et CI build(deps).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      mineures:
        update-types: ["minor", "patch"]
    # Majeures différées, chacune pour un chantier dédié :
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "supabase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "build(deps)"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build(deps)"

  # Le Dockerfile fige `python` et `uv` par digest. Une version de `uv` change aussi `required-version` du
  # pyproject et la version de ci.yml : la demande de mise à jour de `uv` s'accompagne de ces deux fichiers.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # La version de Python de l'image suit celle du projet (`requires-python`, `uv.lock`, ruff, mypy) :
    # changer de version mineure (3.13 → 3.15) est un chantier, pas une mise à jour. Seuls les correctifs
    # et les nouvelles empreintes de la même version sont proposés.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      mineures:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "fix(deps)"
