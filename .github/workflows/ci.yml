name: Contrôles
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  # Annuler un run dépassé seulement sur une demande de fusion : chaque envoi sur main est vérifié.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Même version que `required-version` du pyproject et que l'image.
          version: 0.10.7
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -m "not integration" -q
      # On audite le verrou (`uv.lock`), pas l'environnement : le projet lui-même, installé en
      # mode éditable, n'existe pas sur PyPI et ferait échouer `--strict`.
      - name: Auditer les dépendances
        run: |
          uv export --frozen --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict --progress-spinner off
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # public.ecr.aws limite les tirages anonymes depuis les runners partagés (toomanyrequests).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Toute l'histoire : le manuel d'aide vérifie les commits qu'il cite (verifie_sur).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # edge-runtime reste : les tests appellent des fonctions Edge.
      - name: Démarrer la pile Supabase (3 essais)
        run: |
          for essai in 1 2 3; do
            npx supabase start -x studio,imgproxy,logflare,vector,supavisor && exit 0
            echo "essai $essai échoué, nouvel essai dans 20 s"; npx supabase stop --no-backup || true; sleep 20
          done
          exit 1
      # Les clés locales de démonstration ne sont pas des secrets.
      - run: bash ops/env-local.sh
      # `supabase start` applique déjà les migrations d'une base neuve, et il n'y a pas de seed.sql :
      # un `db reset` ne ferait que redémarrer la pile.
      - run: npm run seed
      - name: Servir les fonctions Edge
        run: |
          nohup npx supabase functions serve > "$RUNNER_TEMP/functions.log" 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H 'Origin: http://localhost:5173' \
              -H 'Access-Control-Request-Method: POST' \
              http://127.0.0.1:54321/functions/v1/accept-invite || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "fonctions prêtes"
              exit 0
            fi
            sleep 2
          done
          echo "les fonctions ne répondent pas (dernier code : $code)"
          cat "$RUNNER_TEMP/functions.log"
          exit 1
      - run: npx vitest run
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Même version que `required-version` du pyproject et que l'image.
          version: 0.10.7
          enable-cache: true
      - run: uv sync --frozen && uv run pytest -m integration -q
      - name: Journal des fonctions
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log" || true
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t popote-api:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: popote-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # l'action liste les commits de la demande de fusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # pas de commentaire : le jeton reste en lecture seule
          # La version par défaut de l'action (8.24.3) ignore les [[allowlists]] de la configuration ;
          # même version qu'en local et que dans popote-web.
          GITLEAKS_VERSION: "8.30.1"
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten --error --metrics off
