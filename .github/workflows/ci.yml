name: Contrôles
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  # Annuler un run dépassé seulement sur une demande de fusion : chaque envoi sur main est vérifié.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Même version que `required-version` du pyproject et que l'image.
          version: 0.10.7
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -m "not integration" -q
      # On audite le verrou (`uv.lock`), pas l'environnement : le projet lui-même, installé en
      # mode éditable, n'existe pas sur PyPI et ferait échouer `--strict`.
      - name: Auditer les dépendances
        run: |
          uv export --frozen --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --strict --progress-spinner off
  contrat:
    # Le contrat OpenAPI vient du code : il est régénéré, comparé au fichier versionné, puis à `main`.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Version publiée le 28/10/2026 ; la somme est celle de l'archive (checksums.txt de la version,
      # recalculée à la main). Changer de version = changer les deux, ensemble.
      OASDIFF_VERSION: "1.35.0"
      OASDIFF_SHA256: "a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `origin/main` doit être présent pour la comparaison.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Même version que `required-version` du pyproject et que l'image.
          version: 0.10.7
          enable-cache: true
      - run: uv sync --frozen
      - name: Régénérer le contrat (un contrat oublié échoue)
        run: |
          uv run python scripts/exporte_contrat.py
          if [ -n "$(git status --porcelain -- openapi.json)" ]; then
            git --no-pager diff -- openapi.json | head -n 80
            echo "::error::openapi.json n'est pas celui que produit le code : lancer 'uv run python scripts/exporte_contrat.py' et le commiter"
            exit 1
          fi
      - name: Installer oasdiff (version figée, somme vérifiée)
        run: |
          set -euo pipefail
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl --silent --show-error --fail --location --max-time 60 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
      - name: Refuser une rupture du contrat par rapport à main
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet origin/main > /dev/null || { echo "::error::origin/main est absent du dépôt"; exit 1; }
          # Tant que `main` n'a pas de contrat (la demande de fusion qui l'ajoute), il n'y a rien à comparer.
          if ! git cat-file -e origin/main:openapi.json 2> /dev/null; then
            echo "::notice::origin/main n'a pas encore d'openapi.json : rien à comparer, le contrôle de rupture passe."
            exit 0
          fi
          git show origin/main:openapi.json > "$RUNNER_TEMP/openapi-main.json"
          "$RUNNER_TEMP/oasdiff" breaking "$RUNNER_TEMP/openapi-main.json" openapi.json \
            --fail-on ERR --deprecation-days-stable 30 --format githubactions
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # public.ecr.aws limite les tirages anonymes depuis les runners partagés (toomanyrequests).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Toute l'histoire : le manuel d'aide vérifie les commits qu'il cite (verifie_sur).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # edge-runtime reste : les tests appellent des fonctions Edge.
      - name: Démarrer la pile Supabase (3 essais)
        run: |
          for essai in 1 2 3; do
            npx supabase start -x studio,imgproxy,logflare,vector,supavisor && exit 0
            echo "essai $essai échoué, nouvel essai dans 20 s"; npx supabase stop --no-backup || true; sleep 20
          done
          exit 1
      # Les clés locales de démonstration ne sont pas des secrets.
      - run: bash ops/env-local.sh
      # `supabase start` applique déjà les migrations d'une base neuve, et il n'y a pas de seed.sql :
      # un `db reset` ne ferait que redémarrer la pile.
      - run: npm run seed
      - name: Servir les fonctions Edge
        run: |
          nohup npx supabase functions serve > "$RUNNER_TEMP/functions.log" 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
              -H 'Origin: http://localhost:5173' \
              -H 'Access-Control-Request-Method: POST' \
              http://127.0.0.1:54321/functions/v1/accept-invite || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "fonctions prêtes"
              exit 0
            fi
            sleep 2
          done
          echo "les fonctions ne répondent pas (dernier code : $code)"
          cat "$RUNNER_TEMP/functions.log"
          exit 1
      - run: npx vitest run
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Même version que `required-version` du pyproject et que l'image.
          version: 0.10.7
          enable-cache: true
      - run: uv sync --frozen && uv run pytest -m integration -q
      - name: Journal des fonctions
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log" || true
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # L'identifiant de l'image scannée : `deploie-essai` vérifie que l'archive chargée est bien celle-là.
      id: ${{ steps.archive.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construire l'image
        run: docker build --build-arg POPOTE_VERSION="$GITHUB_SHA" -t popote-api:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: popote-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      # L'aller-retour est éprouvé à chaque exécution, pas seulement sur main : le déploiement ne tourne
      # qu'après la fusion, trop tard pour découvrir qu'une archive ne rend pas la même image.
      - name: Archiver l'image scannée et vérifier qu'elle se recharge à l'identique
        id: archive
        run: |
          set -euo pipefail
          avant=$(docker image inspect --format '{{.Id}}' popote-api:ci)
          docker save --output "$RUNNER_TEMP/image.tar" popote-api:ci
          docker rmi popote-api:ci > /dev/null
          docker load --input "$RUNNER_TEMP/image.tar" > /dev/null
          apres=$(docker image inspect --format '{{.Id}}' popote-api:ci)
          if [ "$avant" != "$apres" ]; then
            echo "::error::l'archive ne rend pas l'image scannée"
            exit 1
          fi
          echo "id=$avant" >> "$GITHUB_OUTPUT"
      - name: Transmettre l'image scannée au déploiement
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scannee
          path: ${{ runner.temp }}/image.tar
          # Le temps d'un déploiement : l'image ne contient aucun secret, mais n'a pas à rester.
          retention-days: 1
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # l'action liste les commits de la demande de fusion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false" # pas de commentaire : le jeton reste en lecture seule
          # La version par défaut de l'action (8.24.3) ignore les [[allowlists]] de la configuration ;
          # même version qu'en local et que dans popote-web.
          GITLEAKS_VERSION: "8.30.1"
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten --error --metrics off
  migre-essai:
    # Le schéma de l'essai (essai.notre-popote.fr) passe avant le code : `deploie-essai` en dépend, donc un
    # échec ici (migration refusée, droits divergents) arrête le déploiement. Une migration doit rester
    # compatible avec l'appli qui tourne encore (expand puis contract, AGENTS.md).
    needs: [python, contrat, base, image, secrets, semgrep]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: essai
    # Même groupe que le déploiement : jamais deux écritures sur l'essai à la fois, et jamais annulé
    # en cours de route. Un job encore en attente peut être remplacé par le suivant, qui porte les mêmes
    # migrations et davantage.
    concurrency:
      group: deploie-essai
      cancel-in-progress: false
    env:
      # public.ecr.aws limite les tirages anonymes depuis les runners partagés (toomanyrequests).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    permissions:
      contents: read
    steps:
      # Aucune variable ni aucun secret de l'environnement avant l'étape « Préparer la connexion » : GitHub
      # imprime en clair le bloc `env:` d'une étape dans le journal (un dépôt public), variables comprises, et
      # le masque ne vaut que pour ce qui suit. Les installations de paquets, qui exécutent du code tiers,
      # passent donc avant que le mot de passe existe sur le disque.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `ops/aligne_droits.py` lit la base de référence et l'essai avec `psql`.
      - name: S'assurer que psql est là
        run: |
          command -v psql > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client; }
          psql --version
      # La base de référence des droits : une pile locale neuve, que `supabase start` remplit avec les
      # migrations de ce commit et les privilèges par défaut classiques (comme le job `base`).
      - name: Démarrer la pile Supabase locale (3 essais)
        run: |
          for essai in 1 2 3; do
            npx supabase start -x studio,imgproxy,logflare,vector,supavisor && exit 0
            echo "essai $essai échoué, nouvel essai dans 20 s"; npx supabase stop --no-backup || true; sleep 20
          done
          exit 1
      # Seule étape qui lit l'environnement `essai`. Hôte et utilisateur (donc la référence du projet) sont
      # des variables : leur valeur apparaît dans l'en-tête de cette étape, une fois, et nulle part ensuite,
      # parce qu'on les masque ici avant tout usage. Seul un secret (`ESSAI_PGPASSWORD`) n'apparaît jamais.
      # L'URL de connexion va dans un fichier 0600, jamais dans une variable d'environnement ni en sortie.
      - name: Préparer la connexion
        env:
          PGHOST: ${{ vars.ESSAI_PGHOST }}
          PGUSER: ${{ vars.ESSAI_PGUSER }}
          PGPASSWORD: ${{ secrets.ESSAI_PGPASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for valeur in "$PGHOST" "$PGUSER" "${PGUSER#*.}"; do
            [ -z "$valeur" ] || echo "::add-mask::$valeur"
          done
          manque=()
          for nom in PGHOST PGUSER PGPASSWORD; do
            [ -n "${!nom}" ] || manque+=("$nom")
          done
          if [ ${#manque[@]} -gt 0 ]; then
            echo "::error::valeurs manquantes dans l'environnement essai : ${manque[*]} (variables ESSAI_PGHOST, ESSAI_PGUSER ; secret ESSAI_PGPASSWORD)"
            exit 1
          fi
          case "$PGUSER" in
            postgres.?*) ;;
            *) echo "::error::ESSAI_PGUSER doit avoir la forme postgres.<référence> (pooler Supavisor)"; exit 1 ;;
          esac
          # Le mot de passe est encodé : `--db-url` veut une URL dont les caractères spéciaux sont échappés.
          encode=$(jq -rn 'env.PGPASSWORD | @uri')
          echo "::add-mask::$encode"
          # Pooler Supavisor en mode SESSION (port 5432, comme la sauvegarde), pas en mode transaction (6543).
          url="postgresql://${PGUSER}:${encode}@${PGHOST}:5432/postgres"
          echo "::add-mask::$url"
          printf '%s' "$url" > "$RUNNER_TEMP/essai.url"
          # Refuse la prod avant tout envoi, avec la liste noire de l'outil de droits.
          python3 -I -c 'import sys; sys.path.insert(0, "ops"); import aligne_droits; aligne_droits.check_target_dsn(open(sys.argv[1]).read())' "$RUNNER_TEMP/essai.url"
          echo "connexion préparée"
      - name: Lister les migrations à appliquer (à blanc)
        run: |
          set -euo pipefail
          npx supabase db push --db-url "$(cat "$RUNNER_TEMP/essai.url")" --dry-run --skip-vault
      - name: Appliquer les migrations sur l'essai
        run: |
          set -euo pipefail
          # `--yes` : la confirmation ne dépend pas de ce que l'entrée standard d'un job renvoie.
          npx supabase db push --db-url "$(cat "$RUNNER_TEMP/essai.url")" --skip-vault --yes
      # Après l'envoi, même quand il n'y avait rien à appliquer : un projet hébergé neuf ne pose pas les
      # privilèges par défaut de la pile locale, et une migration sans grant explicite y naît sans droits.
      # À blanc, en lecture seule ; le journal nomme les objets divergents, jamais une donnée.
      - name: Comparer les droits de l'essai à ceux de la référence
        run: |
          set -uo pipefail
          ALIGNE_CIBLE_DSN="$(cat "$RUNNER_TEMP/essai.url")" python3 -I ops/aligne_droits.py --sortie "$RUNNER_TEMP/aligne_droits.sql"
          code=$?
          case "$code" in
            0) ;;
            1) echo "::error::les droits de l'essai diffèrent de la référence (objets listés ci-dessus). Corriger avec une migration qui pose ses grant et revoke, ou avec ops/aligne_droits.py --appliquer, puis relancer le job (docs/exploitation.md)" ;;
            *) echo "::error::contrôle des droits impossible (code $code)" ;;
          esac
          exit "$code"
  deploie-essai:
    # Déploiement de l'essai (essai.notre-popote.fr) : seulement après un envoi sur main dont tous les contrôles
    # sont verts et dont les migrations sont appliquées sur l'essai, droits compris.
    needs: [python, contrat, base, image, secrets, semgrep, migre-essai]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: essai
    # Un déploiement en cours n'est jamais annulé : le suivant attend son tour.
    concurrency:
      group: deploie-essai
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SCW_API: https://api.scaleway.com
      SCW_REGION: fr-par
      SCW_REGISTRY: ${{ vars.SCW_REGISTRY }}
      SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-scannee
          path: ${{ runner.temp }}/image
      - name: Charger l'image scannée
        env:
          IMAGE_SCANNEE: ${{ needs.image.outputs.id }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/image/image.tar" > /dev/null
          if [ "$(docker image inspect --format '{{.Id}}' popote-api:ci)" != "$IMAGE_SCANNEE" ]; then
            echo "::error::l'archive n'est pas l'image que Trivy a scannée"
            exit 1
          fi
      - name: Se connecter au registre, pousser l'image et lire son empreinte
        id: pousse
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          set -euo pipefail
          depot="$SCW_REGISTRY/api"
          tag="${GITHUB_SHA::12}"
          printf '%s' "$SCW_SECRET_KEY" | docker login "${SCW_REGISTRY%%/*}" --username nologin --password-stdin
          docker tag popote-api:ci "$depot:$tag"
          docker push "$depot:$tag"
          # L'empreinte vient de la réponse du registre au dépôt : c'est elle que le conteneur exécutera.
          reference=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$depot:$tag" | grep -F "$depot@" | head -n 1)
          if ! printf '%s' "$reference" | grep -Eq '^[a-z0-9./_-]+@sha256:[0-9a-f]{64}$'; then
            echo "::error::empreinte de l'image poussée introuvable ou mal formée"
            exit 1
          fi
          echo "empreinte poussée : ${reference#*@}"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Déployer l'empreinte, vérifier la version en ligne, sinon rétablir l'image précédente
        env:
          REFERENCE: ${{ steps.pousse.outputs.reference }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Le jeton passe par la configuration de curl lue sur l'entrée standard : jamais en argument.
          scw() {
            printf 'header = "X-Auth-Token: %s"\n' "$SCW_SECRET_KEY" \
              | curl --silent --show-error --fail-with-body --max-time 30 --config - "$@"
          }
          conteneur="$SCW_API/containers/v1beta1/regions/$SCW_REGION/containers/$SCW_CONTAINER_ID"

          # Dans ces fonctions, appelées sous `if`, `set -e` ne joue pas : chaque échec est un `return 1`.
          attendre_pret() {
            local statut
            for _ in $(seq 1 60); do
              statut=$(scw "$conteneur" | jq -r '.status') || statut=inconnu
              echo "statut du conteneur : $statut"
              case "$statut" in
                ready) return 0 ;;
                error | locked) echo "::error::le conteneur est en statut $statut"; return 1 ;;
              esac
              sleep 5
            done
            echo "::error::le conteneur n'est pas prêt après 5 minutes"
            return 1
          }
          deployer() {
            local corps
            # La mise à jour redéploie d'elle-même : un POST /deploy en plus répond 409 (déploiement en cours).
            corps=$(jq -n --arg image "$1" '{registry_image: $image, redeploy: true}') || return 1
            scw --request PATCH --header 'Content-Type: application/json' --data "$corps" "$conteneur" > /dev/null || return 1
            sleep 10 # laisser le statut quitter `ready` avant de le lire
            attendre_pret
          }
          # Seule la version rendue prouve que la nouvelle image répond : l'ancienne répond 200 aussi.
          attendre_version() {
            local version fin=$((SECONDS + 180))
            while :; do
              version=$(curl --silent --max-time 10 https://essai.notre-popote.fr/api/healthz | jq -r '.version // empty' 2> /dev/null) || version=""
              echo "version en ligne : ${version:-aucune}"
              if [ "$version" = "$GITHUB_SHA" ]; then
                return 0
              fi
              if [ "$SECONDS" -ge "$fin" ]; then
                echo "::error::/api/healthz ne rend pas la version $GITHUB_SHA après 3 minutes"
                return 1
              fi
              sleep 5
            done
          }

          # Lue avant la mise à jour : c'est l'image à reposer si la nouvelle ne démarre pas.
          precedente=$(scw "$conteneur" | jq -r '.registry_image // empty')
          if [ -z "$precedente" ]; then
            echo "::error::image en place illisible : rien à reposer en cas d'échec, on ne déploie pas"
            exit 1
          fi
          if deployer "$REFERENCE" && attendre_version; then
            echo "déploiement vérifié"
            exit 0
          fi
          echo "::error::la nouvelle image ne tient pas : on repose l'image précédente"
          if deployer "$precedente"; then
            echo "image précédente reposée"
          else
            echo "::error::l'image précédente n'a pas pu être reposée : l'essai est à rétablir à la main"
          fi
          exit 1
      - name: Ne garder que les 5 images les plus récentes
        # Le déploiement est déjà vérifié : un nettoyage raté ne doit pas le rougir.
        continue-on-error: true
        env:
          TAG_COURANT: ${{ steps.pousse.outputs.tag }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        run: |
          set -euo pipefail
          scw() {
            printf 'header = "X-Auth-Token: %s"\n' "$SCW_SECRET_KEY" \
              | curl --silent --show-error --fail-with-body --max-time 30 --config - "$@"
          }
          registre="$SCW_API/registry/v1/regions/$SCW_REGION"
          espace="${SCW_REGISTRY#*/}"
          id_espace=$(scw "$registre/namespaces?name=$espace&project_id=$SCW_DEFAULT_PROJECT_ID" \
            | jq -r --arg n "$espace" '[.namespaces[] | select(.name == $n)][0].id // empty')
          [ -n "$id_espace" ] || { echo "::error::espace de noms $espace introuvable"; exit 1; }
          id_image=$(scw "$registre/images?namespace_id=$id_espace&name=api" \
            | jq -r '[.images[] | select(.name == "api")][0].id // empty')
          [ -n "$id_image" ] || { echo "::error::image api introuvable dans $espace"; exit 1; }
          # Les plus récentes d'abord ; on saute les 5 premières et, par prudence, le tag qu'on vient de déployer.
          anciens=$(scw "$registre/images/$id_image/tags?order_by=created_at_desc&page_size=100" \
            | jq -r --arg courant "$TAG_COURANT" '.tags[5:][] | select(.name != $courant) | .id')
          for id_tag in $anciens; do
            scw --request DELETE "$registre/tags/$id_tag" > /dev/null
            echo "tag supprimé : $id_tag"
          done
