name: Outils de sauvegarde
description: >-
  Installe le client PostgreSQL 17 (dépôt officiel PGDG, clé vérifiée par son empreinte) et age (binaire
  publié, somme de contrôle vérifiée). L'AWS CLI et Node sont ceux du runner.
runs:
  using: composite
  steps:
    - name: Client PostgreSQL 17 (PGDG)
      shell: bash
      env:
        # Empreinte de la clé de signature du dépôt apt.postgresql.org (ACCC4CF8), telle que PGDG la
        # publie (https://www.postgresql.org/download/linux/ubuntu/) : en dur, jamais lue ailleurs.
        EMPREINTE_PGDG: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
      run: |
        set -euo pipefail
        cle="$RUNNER_TEMP/pgdg.asc"
        curl -fsSL --retry 3 -o "$cle" https://www.postgresql.org/media/keys/ACCC4CF8.asc
        # Exactement UNE clé dans le fichier (pas une seconde qu'apt accepterait aussi), et c'est la bonne.
        gpg --show-keys --with-colons "$cle" > "$RUNNER_TEMP/pgdg.colons"
        [ "$(grep -c '^pub:' "$RUNNER_TEMP/pgdg.colons")" = 1 ] || { echo "::error::le fichier PGDG ne contient pas exactement une clé"; exit 1; }
        [ "$(grep -c '^sub:' "$RUNNER_TEMP/pgdg.colons")" = 0 ] || { echo "::error::le fichier PGDG contient une sous-clé"; exit 1; }
        trouvee=$(awk -F: '/^fpr/ { print $10 }' "$RUNNER_TEMP/pgdg.colons")
        [ "$trouvee" = "$EMPREINTE_PGDG" ] || { echo "::error::clé PGDG inattendue"; exit 1; }
        sudo install -D -m 0644 "$cle" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" |
          sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
        # On ne relit que ce dépôt : un autre dépôt du runner, en panne, ne doit pas bloquer la sauvegarde.
        sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
        sudo apt-get install -y --no-install-recommends postgresql-client-17
        # Le 17 doit passer devant le client plus ancien que le runner peut porter : /usr/local/bin
        # précède /usr/bin dans le PATH.
        for outil in pg_dump pg_dumpall pg_restore psql; do
          sudo ln -sf "/usr/lib/postgresql/17/bin/$outil" "/usr/local/bin/$outil"
        done
        pg_dump --version
    - name: age
      shell: bash
      env:
        VERSION_AGE: v1.3.2
        # Somme du tarball publié par https://github.com/FiloSottile/age/releases/tag/v1.3.2
        SOMME_AGE: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/age.tar.gz"
        curl -fsSL --retry 3 -o "$archive" "https://github.com/FiloSottile/age/releases/download/$VERSION_AGE/age-$VERSION_AGE-linux-amd64.tar.gz"
        echo "$SOMME_AGE  $archive" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP" age/age age/age-keygen
        sudo install -m 0755 "$RUNNER_TEMP/age/age" "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/
        age --version
