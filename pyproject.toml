[project]
name = "popote-api"
version = "0.1.0"
description = "L'API de Popote"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  # Liste de fuites (Pwned Passwords) et, plus loin, l'administration de Supabase Auth.
  "httpx>=0.27",
  "tzdata>=2024.2",
  "psycopg-pool>=3.2",
  "webauthn==3.0.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "pip-audit>=2.7", "schemathesis==4.32.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popote_api"]

[tool.uv]
# Même version que l'image (Dockerfile) : un uv plus récent écrit un uv.lock que l'image ne lirait pas.
required-version = "==0.10.7"
# Hygiène de la chaîne d'approvisionnement : rien de publié depuis moins de deux semaines.
# Faux positif : la règle ne connaît que la forme relative ("7 days"), et notre date fixe donne un délai
# de deux semaines au moment de la résolution, avec un verrou qui se rejoue à l'identique.
exclude-newer = "2026-10-29T00:00:00Z"  # nosemgrep: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
# Exception d'UN paquet, pour un correctif de sécurité publié après la date ci-dessus : `opentelemetry-api` 1.45.2
# (29/10/2026, 17 h 29 UTC) corrige CVE-2026-126360 / GHSA-mf5v-w3w3-f6cg. Elle date de plus de deux semaines :
# la règle d'hygiène tient. Voir https://docs.astral.sh/uv/concepts/resolution/#reproducible-resolutions
exclude-newer-package = { opentelemetry-api = "2026-10-30T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/authz", "tests/contract"]
# Les aides de tests (`_commun`, `_routes`, `_fabrique`, `_client`, `_fixtures`) servent aussi à `tests/authz`.
pythonpath = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
strict_markers = true
strict_xfail = true
strict_config = true
markers = [
  "integration: demande la base Supabase locale",
  "oasdiff: demande le binaire oasdiff (variable OASDIFF) ; tourne dans le job contrat de la CI",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]
# Le dépôt garde aussi des scripts et des outils de conception : seul le code de l'API est contrôlé.
include = ["src/**/*.py", "tests/**/*.py", "ops/**/*.py", "scripts/ruptures_admises.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # S311 : les tests tirent au hasard avec une graine fixe

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
files = ["src/popote_api", "scripts/ruptures_admises.py"]
