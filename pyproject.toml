[project]
name = "popote-api"
version = "0.1.0"
description = "L'API de Popote"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/popote_api"]

[tool.uv]
# Hygiène de la chaîne d'approvisionnement : rien de publié depuis moins de deux semaines.
exclude-newer = "2026-10-29T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
strict_markers = true
strict_xfail = true
strict_config = true
markers = ["integration: demande la base Supabase locale"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]
# Le dépôt garde aussi des scripts et des outils de conception : seul le code de l'API est contrôlé.
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["popote_api"]
